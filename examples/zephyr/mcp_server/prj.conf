## Minimal MCP over Wi-Fi configuration (ESP32, Zephyr 4.3)

# POSIX compatibility used by the compact socket transport
CONFIG_POSIX_API=y

# Logging and console
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Console hardware
CONFIG_SERIAL=y

# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y

# Disable heavier subsystems
CONFIG_SHELL=n
CONFIG_PM=n
CONFIG_SMP=n

# Stack / heap
CONFIG_MAIN_STACK_SIZE=12288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=46384
