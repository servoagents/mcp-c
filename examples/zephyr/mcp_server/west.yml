manifest:
  defaults:
    remote: zephyrproject

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject
      repo-path: zephyr
      revision: v4.3.0
      # Checkout Zephyr under the app folder to avoid name/path collisions
      path: zephyr
      import: true

  self:
    # The manifest repository already lives here when scripts/build-zephyr.sh
    # initializes examples/zephyr as the west workspace.
    path: mcp_server
